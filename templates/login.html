<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — LUMI English</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { background: white; padding: 30px; border-radius: 12px; width: 100%; max-width: 380px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .logo { font-size: 26px; font-weight: 800; color: #6c5ce7; text-align: center; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">LUMI English</div>
        {% if error %}
            <div class="alert alert-danger py-2 fs-6">{{ error }}</div>
        {% endif %}
        <form action="/login" method="post">
            <div class="mb-3">
                <label class="form-label text-muted">Логин</label>
                <input type="text" name="username" class="form-control" required placeholder="Введите логин">
            </div>
            <div class="mb-3">
                <label class="form-label text-muted">Пароль</label>
                <input type="password" name="password" class="form-control" required placeholder="Введите пароль">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" style="background-color: #6c5ce7; border: none;">Войти</button>
        </form>
    </div>
</body>
</html>
