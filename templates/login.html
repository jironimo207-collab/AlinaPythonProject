<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — LUMI English</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .brand-logo {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #ff007f 0%, #ffb703 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card-login {
            border: none;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
        }
        .btn-lumi {
            background: linear-gradient(135deg, #ff007f 0%, #ffb703 100%);
            border: none;
            color: #ffffff;
            font-weight: 600;
        }
        .btn-lumi:hover {
            opacity: 0.9;
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="card card-login shadow-sm p-4 bg-white">
    <div class="text-center mb-4">
        <div class="brand-logo mb-1">LUMI English</div>
        <p class="text-muted small">Войдите в свой личный кабинет</p>
    </div>

    {% if error %}
    <div class="alert alert-danger py-2 small">{{ error }}</div>
    {% endif %}

    <form action="/login" method="POST">
        <div class="mb-3">
            <label class="form-label text-muted small fw-semibold">Логин</label>
            <input type="text" name="username" class="form-control" required placeholder="Введите логин">
        </div>
        <div class="mb-4">
            <label class="form-label text-muted small fw-semibold">Пароль</label>
            <input type="password" name="password" class="form-control" required placeholder="******">
        </div>
        <button type="submit" class="btn btn-lumi w-100 py-2">Вoйти</button>
    </form>
</div>

</body>
</html>
