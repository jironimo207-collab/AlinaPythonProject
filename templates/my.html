<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой кабинет — GL STUDY</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .brand-logo { font-size: 24px; font-weight: 800; color: #6c5ce7; text-decoration: none; }
    </style>
</head>
<body>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
        <a href="/my" class="brand-logo">GL STUDY</a>
        <div class="d-flex align-items-center gap-3">
            <span class="fw-semibold">👤 {{ student.name }}</span>
            <a href="/logout" class="btn btn-outline-danger btn-sm">Выйти</a>
        </div>
    </div>

    <div class="card border-0 shadow-sm mb-4">
        <div class="card-header bg-white fw-bold py-3">Мои оценки</div>
        <div class="card-body p-0">
            {% if student.grades %}
            <ul class="list-group list-group-flush">
                {% for grade in student.grades %}
                <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                    <div>
                        <div class="fw-semibold">{{ grade.test_name }}</div>
                        <small class="text-muted">{{ grade.created_at.strftime('%d.%m.%Y') }}</small>
                    </div>
                    <span class="badge bg-primary fs-6 px-3 py-2">{{ grade.score }} / {{ grade.max_score }}</span>
                </li>
                {% endfor %}
            </ul>
            {% else %}
            <p class="text-center text-muted my-4">Оценок пока нет</p>
            {% endif %}
        </div>
    </div>
</div>
</body>
</html>
