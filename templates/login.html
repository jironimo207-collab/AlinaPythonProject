<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — GL STUDY</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 8px; border: 1px solid #e0e0e0; width: 320px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .logo { font-size: 22px; font-weight: bold; color: #7b2cbf; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { font-size: 12px; color: #666; display: block; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { width: 100%; background: #7b2cbf; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .error { color: #dc3545; font-size: 12px; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">GL STUDY</div>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form action="/login" method="post">
            <div class="form-group">
                <label>Логин учителя</label>
                <input type="text" name="username" required placeholder="Введите логин">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" required placeholder="Введите пароль">
            </div>
            <button type="submit" class="btn">Войти в систему</button>
        </form>
    </div>

</body>
</html>
