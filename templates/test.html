<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Моя первая страница</title>

    <!-- Внутренние CSS-стили -->
    <style>
        body {
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }

        h1 {
            color: #2c3e50;
            font-size: 36px;
        }

        p {
            color: #5af555;
            font-size: 18px;
        }

        a {
            display: inline-block;
            background-color: #3497db;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
        }

        a:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <h1>Привет, мир!</h1>
    <p>Я учусь создавать сайты с помощью HTML и CSS.</p>
    <a href="https://google.com" target="_blank">Перейти в Google</a>
</body>
</html>
